name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias (lógica pura + manifiesto sin INTERNET)
        run: ./gradlew test --stacktrace

      - name: Compilar APK de depuración
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verificar que el manifiesto fusionado no pide INTERNET
        run: |
          MANIFIESTO=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged_manifests*debug*' | head -n 1)
          echo "Manifiesto fusionado: $MANIFIESTO"
          if grep -q 'android.permission.INTERNET' "$MANIFIESTO"; then
            echo "::error::El APK pide el permiso INTERNET"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: suiteg-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informes-de-pruebas
          path: |
            **/build/reports/tests/
            app/build/reports/
          if-no-files-found: ignore
